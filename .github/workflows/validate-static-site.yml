name: Validate static site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify site entry point and controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          required = (
              '<canvas id="scene"',
              'id="coverage"',
              'id="sourcePower"',
              'id="cycles"',
              'id="start"',
              'id="reset"',
              'sim-model.js',
              'app.js',
          )

          missing = [value for value in required if value not in html]
          if missing:
              raise SystemExit(f"Missing required site elements: {missing}")

          print("Static-site structure validation passed")
          PY

      - name: Run simulation model tests
        run: node tests/sim-model.test.js

      - name: Parse browser application JavaScript
        run: node --check app.js
