name: Validate static site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify homepage and ALE simulator structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path("index.html").read_text(encoding="utf-8")
          ale = Path("ale.html").read_text(encoding="utf-8")
          home_required = (
              "Materials Science Platform",
              'id="homeCards"',
              'id="themeGrid"',
              'href="ale.html"',
              "assets/ale-plasma.svg",
              "assets/materials-learning.svg",
          )
          ale_required = (
              'ALE Simulator V0.6.4',
              'id="glScene"',
              'id="inSituAtoms"',
              'id="atomScene"',
              'id="inSituBtn"',
              'id="focusReplay"',
              'id="focusSlow"',
              'id="clFlow"',
              'id="arFlow"',
              'id="biasSwitch"',
              'id="biasPower"',
              'id="pressure"',
              'id="exposure"',
              'id="cycles"',
              'id="playBtn"',
              'id="pauseBtn"',
              'id="resetBtn"',
          )
          for label, page, required in (
              ("homepage", home, home_required),
              ("ALE simulator", ale, ale_required),
          ):
              missing = [value for value in required if value not in page]
              if missing:
                  raise SystemExit(f"{label}: missing required elements: {missing}")

          if 'id="coverage"' in ale:
              raise SystemExit("ALE simulator still contains obsolete target-coverage slider")

          for asset in ("assets/ale-plasma.svg", "assets/materials-learning.svg"):
              if not Path(asset).is_file():
                  raise SystemExit(f"Missing homepage artwork: {asset}")

          print("Homepage and ALE simulator structure validation passed")
          PY

      - name: Run simulation model tests
        run: node tests/sim-model.test.js

      - name: Parse deployed ALE V0.6.4 inline scripts
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('ale.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, re.S)
          if len(scripts) != 4:
              raise SystemExit(f'Expected four V0.6.4 scripts; got {len(scripts)}')
          for i, content in enumerate(scripts):
              Path(f'/tmp/ale-v064-script-{i}.js').write_text(content, encoding='utf-8')
          PY
          for file in /tmp/ale-v064-script-*.js; do
            node --check "$file"
          done

      - name: Parse archived ALE source JavaScript
        run: |
          node --check app.js
          node --check sim-model.js
          node --check chamber-view.js
          node --check surface-v041.js
