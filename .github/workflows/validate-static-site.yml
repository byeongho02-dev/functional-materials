name: Validate static site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify homepage and ALE simulator structure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path("index.html").read_text(encoding="utf-8")
          ale = Path("ale.html").read_text(encoding="utf-8")
          home_required = (
              "Materials Science Platform",
              'id="homeCards"',
              'id="themeGrid"',
              'href="ale.html"',
              'href="ale-v092-fab.html"',
              "assets/ale-v092-chamber.png",
              "assets/materials-learning.svg",
          )
          ale_required = (
              'ALE Simulator V0.6.4',
              'id="glScene"',
              'id="inSituAtoms"',
              'id="atomScene"',
              'id="inSituBtn"',
              'id="focusReplay"',
              'id="focusSlow"',
              'id="clFlow"',
              'id="arFlow"',
              'id="biasSwitch"',
              'id="biasPower"',
              'id="pressure"',
              'id="exposure"',
              'id="cycles"',
              'id="playBtn"',
              'id="pauseBtn"',
              'id="resetBtn"',
          )
          for label, page, required in (
              ("homepage", home, home_required),
              ("ALE simulator", ale, ale_required),
          ):
              missing = [value for value in required if value not in page]
              if missing:
                  raise SystemExit(f"{label}: missing required elements: {missing}")

          if 'id="coverage"' in ale:
              raise SystemExit("ALE simulator still contains obsolete target-coverage slider")

          for asset in ("assets/ale-plasma.svg", "assets/materials-learning.svg", "assets/ale-v092-chamber.png"):
              if not Path(asset).is_file():
                  raise SystemExit(f"Missing homepage artwork: {asset}")

          # Lecture 3 is published under the shape-memory-alloy theme.
          if 'id="smaEntry"' not in home or 'href="learning-lecture3.html#chapter-1"' not in home:
              raise SystemExit("Homepage missing lecture 3 shape-memory alloy link")
          content = Path("learning-shared/content.js").read_text(encoding="utf-8")
          if "3강 핵심정리" not in content or "확인문제" in content:
              raise SystemExit("Lecture 3 must conclude with key summary, not quiz")
          for n in (1, 2, 3):
              page = Path(f"learning-lecture{n}.html").read_text()
              assert f'data-learning-course="{n}"' in page
              assert f'learning-scenes/model{n}.js' in page
              assert 'learning-shared/scene-core.js' in page
              assert 'data:image/' not in page, "Unverified embedded photographs must not return"
          print("Homepage, lecture 3, and ALE simulator structure validation passed")
          PY

      - name: Run simulation model tests
        run: node tests/sim-model.test.js

      - name: Parse deployed ALE V0.6.4 inline scripts
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('ale.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)
          if len(scripts) != 4:
              raise SystemExit(f'Expected four V0.6.4 scripts; got {len(scripts)}')
          for i, content in enumerate(scripts):
              Path(f'/tmp/ale-v064-script-{i}.js').write_text(content, encoding='utf-8')
          PY
          for file in /tmp/ale-v064-script-*.js; do
            node --check "$file"
          done

      - name: Parse and validate modular lecture 1–3 models
        run: |
          for file in learning-shared/*.js learning-scenes/*.js; do
            node --check "$file"
          done
          node tests/learning-models.test.cjs

      - name: Parse archived ALE source JavaScript
        run: |
          node --check app.js
          node --check sim-model.js
          node --check chamber-view.js
          node --check surface-v041.js

      - name: Check the six themes and parse lecture 4 modules
        run: |
          node --check learning-hydrogen/model.js
          node --check learning-hydrogen/content.js
          node --check learning-hydrogen/app.js
          node tests/hydrogen.test.cjs
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          page = Path('index.html').read_text()
          block = re.search(r'const themes=\[(.*?)\];', page, re.S).group(1)
          assert re.findall(r"id:'([^']+)'", block) == ['fundamentals','biomaterials','sma','hydrogen','nano','mof']
          assert 'antimicrobial' not in page and 'themePending' not in page
          assert 'learning-hydrogen/index.html' in page
          assert Path('assets/learning-common.css').is_file()
          PYTHON
