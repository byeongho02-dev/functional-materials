<main><div class="bread">MATERIALS SCIENCE / FUNCTIONAL MATERIALS / LECTURE 01</div><section class="intro"><div class="eyebrow" id="label"></div><h1 id="title"></h1><p id="lead"></p><div class="track"><span id="progress"></span></div></section><section class="card"><div class="visual-head"><b id="visualLabel"></b><span id="visualType"></span></div><div class="visual" id="visual"></div><div class="copy"><h2 id="sub"></h2><p id="bodycopy"></p><div class="minis" id="minis"></div><div class="note" id="note"></div></div></section><div class="pager"><button id="prev">← 이전 개념</button><span id="pageCount"></span><button class="primary" id="next">다음 개념 →</button></div><div class="footer">Materials Learning · 기능성재료 1강</div></main></div>
<script>
const lessons=[
['기능성재료는 어디에 사용될까?','기능성재료','LED부터 생체재료, 전자파 차폐, 센서까지. 첫 수업에서는 재료의 종류보다 필요한 기능을 먼저 살펴보자.','실생활 기술에서 출발하기','1강은 디스플레이(LED·UV LED·Flexible Display), 에너지(태양전지), 생체재료, 나노전자재료, 나노촉매, 센서재료를 주요 응용 분야로 소개해. 각 분야에 필요한 기능을 연결해 보자.','재료가 어떤 기능을 수행하는가를 먼저 생각해 보자.','overview',[['디스플레이·에너지','빛을 내거나 변환하고 에너지를 생산'],['생체·나노전자','인체와 접촉하거나 전자기기 보호'],['촉매·센서','반응 촉진 및 온도·빛·가스 검출']]],
['원자와 물질의 기본 구조','원자','재료의 성질을 이해하려면 물질을 이루는 원자와 원자핵, 전자를 먼저 알아야 해.','원자번호는 양성자의 수를 나타낸다','실리콘(Si)은 원자번호 14번으로 중성 원자에 양성자와 전자가 각각 14개 있어. 원자량은 약 28.09이며, 1 mol에는 약 6.022×10²³개의 입자가 포함돼.','원자번호와 원자량은 서로 다른 개념이야.','atom',[['원자번호','양성자의 수'],['원자량','탄소-12 기준 상대 원자 질량'],['1 mol','약 6.022×10²³개의 입자']]],
['전자배치와 원자가전자','원자가전자','원자가전자에서 출발해 원자가 어떤 결합을 만드는지 이해해 보자.','원자가전자가 결합과 화학적 성질에 중요하다','전자배치는 전자가 원자 내에서 어떻게 분포하는지를 나타내. 탄소(C)의 전자배치는 1s² 2s² 2p²이며 원자가전자는 4개야. 전자를 잃으면 양이온, 얻으면 음이온이 될 수 있어.','Bohr 모형은 교육용 개념 표현으로 실제 전자구름을 그대로 나타내지 않아.','valence',[['양이온','전자를 잃어 양전하 획득'],['음이온','전자를 얻어 음전하 획득'],['원자가전자','주로 결합에 관여하는 바깥 전자']]],
['재료의 분류와 성질','재료 분류','금속·세라믹·고분자의 구조와 결합 차이를 살펴보자.','금속, 세라믹, 고분자의 기본 성질을 비교한다','고체 재료는 금속, 세라믹, 고분자로 크게 분류할 수 있어. 강도, 파괴인성, 전기전도도 등은 재료에 따라 다르며 기계적·전기적·열적·자기적·광학적 특성으로 분석할 수 있어.','재료군별 특징은 일반적인 경향이며 실제 특성은 조성·구조·조건에 따라 달라져.','materials',[['금속','전도성·연성이 좋은 경우가 많음'],['세라믹','내열성·경도가 높으나 취성 고려'],['고분자','가볍고 유연하며 가공이 쉬움']]],
['금속결합과 원자 간 결합','결합','원자 간 결합은 물질의 융점, 강도, 전도성에 영향을 줘.','결합 방식이 재료의 성질을 좌우한다','금속결합은 비편재화된 전자와 금속 양이온 사이의 결합으로 설명할 수 있어. 이온결합(NaCl), 공유결합(CH₄), 반데르발스·수소결합도 주요 개념이야. 결합에너지와 융점·탄성계수·열팽창계수의 관계도 살펴봐.','결합에너지가 큰 경우 일반적으로 융점과 탄성계수는 높고 열팽창은 작은 경향이 있어.','bond',[['금속결합','자유전자 모형'],['이온·공유결합','전자 이동 또는 공유'],['2차 결합','반데르발스·수소결합']]],
['생체·나노전자·촉매의 활용','응용재료','재료의 물성을 실제 기술에서 어떻게 활용하는지 연결해 보자.','사용 목적에 따라 필요한 재료 성능이 달라진다','생체적합재료와 임플란트, 바이오세라믹은 인체 내 사용 환경을 고려해. 전자파 차폐, 초전도, 탄소나노튜브(CNT)도 소개하며 나노촉매는 높은 표면적을 이용하는 사례로 설명돼.','이 단원은 응용 개요이며 상세 반응·측정 원리는 이후 주제별 심화 학습에서 다룰 수 있어.','applications',[['생체재료','생체적합성과 기계적 강도'],['전자파 차폐·CNT','전도성·경량화'],['나노촉매','작은 입자의 큰 표면적']]],
['센서재료는 어떻게 감지할까?','센서','서미스터, 포토다이오드, 가스센서가 어떤 변화를 전기적 신호로 바꾸는지 살펴보자.','온도·빛·가스의 변화를 감지한다','서미스터는 온도에 따른 저항 변화를 이용하며 NTC·PTC·CTR 방식이 있어. 포토다이오드는 pn 접합에 빛을 조사할 때 생성되는 전자·정공을 활용해. 가스센서는 금속산화물 표면에 가스가 접촉할 때의 전도도 변화를 이용해.','그래프는 NTC/PTC의 정성적 경향을 나타내는 교육용 모델로, 측정 데이터가 아니야.','sensor',[['서미스터','온도 → 저항'],['포토다이오드','빛 → 전자·정공 → 전류'],['가스센서','가스 접촉 → 전도도 변화']]],
['1강 핵심 개념 확인','학습 정리','응용에서 출발해 원자·결합·물성·센서까지 연결할 수 있는지 점검해 보자.','재료의 구조와 성질을 연결한다','1강은 기능성재료의 응용 분야를 소개하고 원자·전자배치·재료 분류·원자 간 결합을 거쳐 물성과 응용을 이해하는 내용이야. 아래 문제를 풀고 복습해 보자.','문제에서 헷갈리는 개념이 있다면 왼쪽 목차를 눌러 해당 단원으로 돌아가 보자.','quiz',[['구조','원자와 전자의 배치'],['물성','전도성·강도·온도 응답'],['응용','필요한 성능을 재료에 연결']]]
];
let page=0,element='Si',sensor=50,kind='NTC',answer='';const $=q=>document.querySelector(q);
function go(n){page=Math.max(0,Math.min(7,n));render();history.replaceState(null,'','#chapter-'+(page+1));window.scrollTo({top:0,behavior:'smooth'})}
function render(){let d=lessons[page];$('#chapters').innerHTML=lessons.map((v,i)=>'<button class="chapter '+(page===i?'active':'')+'" data-to="'+i+'"><i>'+String(i+1).padStart(2,'0')+'</i>'+v[1]+'</button>').join('');$('#label').textContent='CHAPTER '+String(page+1).padStart(2,'0')+' / 08';$('#title').textContent=d[0];$('#lead').textContent=d[2];$('#progress').style.width=(page+1)/8*100+'%';$('#visualLabel').textContent=['APPLICATIONS','ATOMIC STRUCTURE','ELECTRON CONFIGURATION','MATERIAL GROUPS','BONDING','APPLICATION CASES','SENSOR PRINCIPLES','QUICK REVIEW'][page];$('#visualType').textContent=d[1];$('#sub').textContent=d[3];$('#bodycopy').textContent=d[4];$('#note').textContent=d[5];$('#minis').innerHTML=d[7].map(x=>'<div class="mini"><b>'+x[0]+'</b><p>'+x[1]+'</p></div>').join('');$('#visual').innerHTML=visual(d[6]);$('#prev').disabled=!page;$('#next').disabled=page===7;$('#pageCount').textContent=(page+1)+' / 8';document.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>go(+b.dataset.to));wire()}
function svgAtoms(){let r={H:[1],C:[2,4],Si:[2,8,4]}[element],atomic={H:1,C:6,Si:14}[element],mass={H:'1.008',C:'12.01',Si:'28.09'}[element],configuration={H:'1s¹',C:'1s² 2s² 2p²',Si:'1s² 2s² 2p⁶ 3s² 3p²'}[element];let orbits=r.map((n,j)=>{let R=42+j*39;return '<circle cx="165" cy="138" r="'+R+'" fill="none" stroke="#b2ccdf" stroke-width="2"/>'+Array.from({length:n},(_,i)=>{let a=i/n*Math.PI*2-.4;return '<circle cx="'+(165+Math.cos(a)*R)+'" cy="'+(138+Math.sin(a)*R)+'" r="6.5" fill="'+(j===r.length-1?'#14a0af':'#528bbd')+'"/>'}).join('')}).join('');return '<svg class="atom-svg" viewBox="0 0 330 280">'+orbits+'<circle cx="165" cy="138" r="26" fill="#e34c47"/><text x="165" y="144" font-size="14" font-weight="800" text-anchor="middle" fill="white">'+element+'</text></svg><div class="tip">원자핵(빨강) · 전자(파랑) · 전자껍질(선)</div><div class="stat"><small>원자번호</small><strong>'+atomic+'</strong></div><div class="stat"><small>원자량</small><strong>'+mass+'</strong></div><div class="stat"><small>전자배치</small><strong style="font-size:14px">'+configuration+'</strong></div>'}
function visual(kind){if(kind==='atom'||kind==='valence')return '<div><div class="tabs">'+['Si','C','H'].map(x=>'<button data-element="'+x+'" class="'+(element===x?'active':'')+'">'+x+' 선택</button>').join('')+'</div><div class="atom-row"><div>'+svgAtoms()+'</div><div><h3>전자배치 확인</h3><p>원자번호에 따라 전자와 원자가전자 수가 달라져. 다른 원소를 선택해서 비교해 보자.</p><p style="color:#647a8e;font-size:12px">전자의 위치와 궤도는 교육용 단순화 모형</p></div></div></div>';
if(kind==='overview'||kind==='applications'){let tiles=[['◈','디스플레이·에너지','LED · 태양전지'],['✚','생체재료','임플란트·바이오세라믹'],['⬡','나노전자재료','CNT · 전자파 차폐'],['◎','센서·나노촉매','온도 · 빛 · 가스 검출']];if(kind==='applications')tiles=[['✚','생체재료','인체 내부 사용 환경'],['◈','전자파 차폐','전자기 간섭 억제'],['⬡','CNT','전도성 나노구조'],['✦','나노촉매','표면적과 반응성']];return '<div class="feature"><div><div class="eyebrow">INTRODUCTION</div><h3>기술의 기능을 만드는 재료</h3><p>응용 분야의 요구 성능을 먼저 이해하고, 어떤 원자 구조와 재료 특성이 이를 가능하게 하는지 이어서 배워 보자.</p></div><div class="tiles">'+tiles.map(t=>'<div class="tile"><div class="symbol">'+t[0]+'</div><b>'+t[1]+'</b><small>'+t[2]+'</small></div>').join('')+'</div></div>'}
if(kind==='materials')return '<div class="materials">'+[['금속','전기전도성, 연성','금속결합을 바탕으로 높은 전기·열전도성을 보이는 경우가 많음'],['세라믹','높은 경도, 내열성','이온·공유결합 성격이 강하며 취성이 문제가 될 수 있음'],['고분자','경량, 가공성','긴 분자 사슬에 의해 유연성·성형성이 나타날 수 있음']].map(x=>'<div class="material"><div class="eyebrow">MATERIAL GROUP</div><h3>'+x[0]+'</h3><b>'+x[1]+'</b><p>'+x[2]+'</p></div>').join('')+'</div>';
if(kind==='bond')return '<div class="bond-layout"><svg viewBox="0 0 360 230"><rect x="1" y="1" width="358" height="228" rx="16" fill="#e9f4fb"/>'+[[90,75],[165,75],[240,75],[90,150],[165,150],[240,150]].map(([x,y])=>'<circle cx="'+x+'" cy="'+y+'" r="25" fill="#659ac9"/><circle cx="'+(x+24)+'" cy="'+(y+20)+'" r="5" fill="#f8b64d"/>').join('')+'</svg><div><h3>금속결합 · 전자 바다 모형</h3><p>금속 양이온과 비편재화된 전자들의 정전기적 인력으로 결합을 설명해. 이온결합은 전자 이동, 공유결합은 전자 공유를 중심으로 이해할 수 있어.</p></div></div>';
if(kind==='sensor'){const r=kindValue();return '<div class="sensor-grid"><div><div class="tabs">'+['NTC','PTC'].map(t=>'<button data-kind="'+t+'" class="'+(t===window.kind?'active':'')+'">'+t+'</button>').join('')+'</div><svg viewBox="0 0 330 255" role="img" aria-label="서미스터 온도-저항 정성 그래프"><path d="M44 20 V215 H315" fill="none" stroke="#7893a9" stroke-width="2"/><text x="9" y="16" fill="#607b93" font-size="12">상대 저항</text><text x="264" y="243" fill="#607b93" font-size="12">온도 (°C)</text><path d="'+(window.kind==='NTC'?'M45 28 C120 118 177 175 315 202':'M45 203 C120 197 177 144 315 33')+'" fill="none" stroke="#168da2" stroke-width="4"/><circle cx="'+(45+sensor*2.7)+'" cy="'+(window.kind==='NTC'? 28+175*(1-Math.exp(-sensor/25))/(1-Math.exp(-4)):203-170*Math.pow(sensor/100,2))+'" r="7" fill="#e4504a"/></svg></div><div><h3>서미스터 응답</h3><label>온도: <b>'+sensor+'°C</b></label><input type="range" id="temp" min="0" max="100" value="'+sensor+'"><div class="sensor-stat">'+r.toFixed(2)+' (상대값)</div><p>NTC는 온도가 상승하면 저항이 감소하고, PTC는 상승하는 경향이 있어.</p><div class="tip">설명용 곡선이며 특정 소자의 실제 측정값이 아님</div></div></div>'}
if(kind==='quiz')return '<div style="max-width:680px;margin:auto"><div class="eyebrow">QUIZ · 핵심 개념 점검</div><h2>탄소 원자의 원자가전자 수는?</h2><p>탄소의 전자배치 1s² 2s² 2p²를 떠올려 보자.</p><div class="quiz-options options">'+['2개','4개','6개','8개'].map(x=>'<button data-answer="'+x+'" class="'+(x===answer?'active':'')+'">'+x+'</button>').join('')+'</div><div class="quiz-result">'+(answer?(answer==='4개'?'정답! 두 번째 전자껍질의 전자 4개가 원자가전자야.':'다시 생각해 보자. 2s²와 2p²를 더해 봐.'):'')+'</div></div>'}
function kindValue(){return window.kind==='NTC'?Math.exp(-sensor/35)*10:(1+sensor/28)}
function wire(){document.querySelectorAll('[data-element]').forEach(b=>b.onclick=()=>{element=b.dataset.element;render()});document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{window.kind=b.dataset.kind;render()});let slider=$('#temp');if(slider)slider.oninput=()=>{sensor=+slider.value;render()};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answer=b.dataset.answer;render()})}
window.kind='NTC';$('#prev').onclick=()=>go(page-1);$('#next').onclick=()=>go(page+1);const hash=location.hash.match(/chapter-(\d+)/);if(hash)page=Math.min(7,Math.max(0,Number(hash[1])-1));render();
</script></body></html>
