<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>기능성 재료 1강 · Interactive Education</title>
<style>
:root{
  --bg:#f5f7fb; --panel:#ffffff; --panel2:#f9fbff; --text:#172033; --muted:#667085;
  --line:#d9e0ea; --accent:#2f6fed; --accent2:#7aa2ff; --blue:#3b82f6; --red:#ef4444;
  --orange:#f59e0b; --green:#22c55e; --purple:#8b5cf6; --cyan:#06b6d4; --shadow:0 10px 28px rgba(16,24,40,.08);
}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
#app{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.deck{width:min(1600px,100%);height:min(900px,100%);aspect-ratio:16/9;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.topbar{height:66px;flex:0 0 66px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;background:#fff}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}.title{font-size:21px;font-weight:900;line-height:1.1}.spacer{flex:1}.pagecount{font-size:13px;font-weight:800;color:var(--muted)}.source{font-size:11px;border:1px solid var(--line);padding:6px 9px;border-radius:999px;color:var(--muted);font-weight:800}
.content{display:grid;grid-template-columns:1.03fr .97fr;min-height:0;flex:1}.left,.right{min-width:0;min-height:0;padding:16px}.left{border-right:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column}.right{background:#fff;overflow:hidden}
.section-label{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.sim-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.sim-head h2{font-size:15px;margin:0;font-weight:900}.badge{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;color:var(--muted);font-weight:800}
.simbox{flex:1;min-height:0;border:1px solid var(--line);background:#fff;border-radius:14px;position:relative;overflow:hidden}.simbox svg,.simbox canvas{display:block;width:100%;height:100%}.simbox svg text{font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif;paint-order:stroke;stroke:rgba(255,255,255,.96);stroke-width:3px;stroke-linejoin:round}.simbox svg .nohalo{paint-order:normal;stroke:none}.hud{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;max-width:90%}.pill{font-size:11px;font-weight:800;background:rgba(255,255,255,.94);border:1px solid var(--line);padding:6px 8px;border-radius:8px;box-shadow:0 2px 10px rgba(16,24,40,.04)}
.controls{padding-top:10px;display:grid;gap:8px}.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);min-height:38px;padding:0 12px;border-radius:9px;font-weight:850;cursor:pointer}.btn:hover{border-color:#a8b7cc}.btn.primary,.btn.active{background:#edf3ff;border-color:var(--accent);color:#194cba}.btn:disabled{opacity:.45;cursor:not-allowed}.slider{display:grid;grid-template-columns:120px 1fr 78px;gap:10px;align-items:center}.slider label{font-size:11px;font-weight:800;color:var(--muted)}input[type=range]{width:100%;accent-color:var(--accent)}.value{font-size:11px;text-align:right;font-weight:900;font-variant-numeric:tabular-nums}
.question{font-size:23px;font-weight:950;line-height:1.22;margin:0 0 12px}.theory-grid{display:grid;gap:8px}.theory-card{border:1px solid var(--line);border-radius:11px;padding:10px 11px}.theory-card.active{border-left:4px solid var(--accent);background:#fbfdff}.kicker{font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.theory-card p{font-size:12.4px;line-height:1.5;margin:0}.formula{font-family:Georgia,"Times New Roman",serif;font-size:18px;margin:4px 0 3px}.mini{font-size:11.3px!important;color:var(--muted)}.observe{border:1px dashed #b9c7db;border-radius:11px;padding:10px 11px;font-size:12px;line-height:1.45;background:#fbfcfe}.observe b{font-weight:950}.step-indicator{margin-top:8px;border-radius:9px;padding:8px 10px;background:#f4f7fb;border:1px solid var(--line);font-size:11.5px;line-height:1.42}
.footer{height:58px;flex:0 0 58px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff}.dots{display:flex;gap:5px;align-items:center;justify-content:center;flex:1}.dot{width:8px;height:8px;padding:0;border:0;border-radius:50%;background:#cbd5e1;cursor:pointer}.dot.active{background:var(--accent);transform:scale(1.25)}.footer .btn{min-height:40px}
.legend{font-size:10px;color:var(--muted)}.theory-wide{grid-column:1/-1;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff}.theory-table{width:100%;border-collapse:collapse;font-size:11.2px;margin-top:6px}.theory-table th,.theory-table td{border:1px solid var(--line);padding:6px 7px;text-align:center;vertical-align:middle}.theory-table th{background:#f8fafc;font-weight:900}.figure-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.figure-card{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fbfcfe}.figure-card svg{display:block;width:100%;height:76px}.figure-card b{display:block;font-size:11px;margin-bottom:4px}.small-list{margin:6px 0 0 16px;padding:0;font-size:11.6px;line-height:1.45}.chipline{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:#fff}
@media(max-width:1050px){#app{padding:0}.deck{border-radius:0;width:100%;height:100%;aspect-ratio:auto}.topbar{height:58px;flex-basis:58px}.title{font-size:18px}.content{grid-template-columns:1fr 1fr}.left,.right{padding:12px}.question{font-size:19px}.theory-card p{font-size:11.5px}.formula{font-size:16px}}
</style>
</head>
<body>
<div id="app">
  <main class="deck" tabindex="0" aria-label="기능성 재료 1강 인터랙티브 교육자료">
    <header class="topbar">
      <div><div class="eyebrow">Functional Materials · Interactive Education</div><div class="title" id="pageTitle"></div></div>
      <div class="spacer"></div><div class="pagecount" id="pageCount"></div><div class="source">1강 PDF 기반</div>
    </header>
    <section class="content">
      <section class="left">
        <div class="section-label">LEFT · Principle Simulation</div>
        <div class="sim-head"><h2 id="simTitle"></h2><span class="badge" id="simType"></span></div>
        <div class="simbox" id="simbox"></div>
        <div class="controls" id="controls"></div>
      </section>
      <aside class="right">
        <div class="section-label">RIGHT · Theory that explains the simulation</div>
        <div id="theory"></div>
      </aside>
    </section>
    <footer class="footer">
      <button class="btn" id="prev">← 이전</button><div class="dots" id="dots"></div><button class="btn" id="next">다음 →</button>
    </footer>
  </main>
</div>
<script>
(()=>{
const q=s=>document.querySelector(s), sim=q('#simbox'), ctrl=q('#controls'), theory=q('#theory');
const pageTitle=q('#pageTitle'), pageCount=q('#pageCount'), simTitle=q('#simTitle'), simType=q('#simType'), dots=q('#dots');
let page=0, raf=0, timer=0, running=false;
const stop=()=>{running=false;if(raf)cancelAnimationFrame(raf);raf=0;if(timer)clearTimeout(timer);timer=0};
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
const button=(id,t,cls='')=>`<button class="btn ${cls}" id="${id}" type="button">${t}</button>`;
const rightPanel=(question,phenomenon,why,mechanism,engineering,observe,step='')=>{
 theory.innerHTML=`<div class="question">${question}</div><div class="theory-grid">
 <div class="theory-card active"><div class="kicker">현재 화면에서 일어난 현상</div><p>${phenomenon}</p></div>
 <div class="theory-card"><div class="kicker">왜 일어나는가?</div><p>${why}</p></div>
 <div class="theory-card"><div class="kicker">공학적 메커니즘</div><p>${mechanism}</p></div>
 ${engineering?`<div class="theory-card"><div class="kicker">식 · 변수 · 공학적 보강</div>${engineering}</div>`:''}
 <div class="observe"><b>왼쪽에서 확인할 것</b><br>${observe}</div>${step?`<div class="step-indicator" id="stepText">${step}</div>`:''}
 </div>`;
};
const pages=[
{
 title:'01 · 기능성 재료의 역할', type:'Interactive Diagram', simtitle:'기능에 따라 재료의 역할이 어떻게 달라지는가',
 render(){
 sim.innerHTML=`<div class="hud"><span class="pill" id="mapHud">선택 분야 · 디스플레이</span><span class="pill" id="mapSub">빛을 만들고 정보를 표시하는 재료</span></div><svg viewBox="0 0 640 360" aria-label="기능성 재료 분야 개요"><defs><linearGradient id="hubGrad" x1="0" x2="1"><stop offset="0%" stop-color="#eef4ff"/><stop offset="100%" stop-color="#f8fbff"/></linearGradient><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#22436f" flood-opacity="0.10"/></filter></defs><g id="map"></g></svg>`;
 ctrl.innerHTML='';
 const items=[
  {name:'디스플레이', x:38, y:38,  w:152, h:66, ex:'LED · UV LED · Flexible', role:'빛을 만들고 정보를 표시하는 재료', role2:'광 방출·표시 기능', color:'#3b82f6', short:'광 방출 / 표시', icon:'display'},
  {name:'에너지',   x:244, y:16,  w:152, h:66, ex:'태양전지', role:'빛·화학에너지를 전기로 바꾸는 재료', role2:'에너지 변환·저장', color:'#f59e0b', short:'변환 / 저장', icon:'energy'},
  {name:'생체재료', x:450, y:38,  w:152, h:66, ex:'인공장기 · 임플란트', role:'인체 기능을 보완하는 재료', role2:'생체적합성 확보', color:'#ef4444', short:'생체적합성', icon:'bio'},
  {name:'나노전자', x:38, y:188, w:152, h:66, ex:'차폐 · 초전도 · CNT', role:'전기적·전자기적 기능을 높이는 재료', role2:'고성능 전자기술', color:'#8b5cf6', short:'전기 / 전자기', icon:'nanoe'},
  {name:'나노촉매', x:244, y:210, w:152, h:66, ex:'Pt · Pd 촉매', role:'표면반응을 빠르게 만드는 재료', role2:'촉매·환경 응용', color:'#22c55e', short:'표면반응', icon:'catalyst'},
  {name:'센서재료', x:450, y:188, w:152, h:66, ex:'Thermistor · Photodiode · Gas', role:'외부 자극을 신호로 바꾸는 재료', role2:'감지·신호화 기능', color:'#06b6d4', short:'감지 / 신호화', icon:'sensor'}
 ];
 const iconSVG=(item)=>{const c=item.color, x=item.x+18, y=item.y+17; if(item.icon==='display') return `<rect x="${x}" y="${y}" width="24" height="16" rx="3" fill="none" stroke="${c}" stroke-width="2"/><line x1="${x+8}" y1="${y+19}" x2="${x+16}" y2="${y+19}" stroke="${c}" stroke-width="2"/><line x1="${x+12}" y1="${y+16}" x2="${x+12}" y2="${y+19}" stroke="${c}" stroke-width="2"/>`; if(item.icon==='energy') return `<circle cx="${x+12}" cy="${y+9}" r="6" fill="none" stroke="${c}" stroke-width="2"/><g stroke="${c}" stroke-width="2"><line x1="${x+12}" y1="${y-2}" x2="${x+12}" y2="${y-7}"/><line x1="${x+12}" y1="${y+20}" x2="${x+12}" y2="${y+25}"/><line x1="${x+1}" y1="${y+9}" x2="${x-4}" y2="${y+9}"/><line x1="${x+23}" y1="${y+9}" x2="${x+28}" y2="${y+9}"/></g><rect x="${x+5}" y="${y+14}" width="14" height="10" fill="none" stroke="${c}" stroke-width="2"/>`; if(item.icon==='bio') return `<path d="M${x+12},${y+4} c4,-6 14,-3 14,5 c0,8 -8,13 -14,18 c-6,-5 -14,-10 -14,-18 c0,-8 10,-11 14,-5z" fill="none" stroke="${c}" stroke-width="2"/>`; if(item.icon==='nanoe') return `<rect x="${x+3}" y="${y+4}" width="18" height="18" rx="4" fill="none" stroke="${c}" stroke-width="2"/><path d="M${x+24} ${y+6} q8 6 0 12 q-8 6 0 12" fill="none" stroke="${c}" stroke-width="2"/>`; if(item.icon==='catalyst') return `<circle cx="${x+8}" cy="${y+8}" r="4" fill="none" stroke="${c}" stroke-width="2"/><circle cx="${x+24}" cy="${y+8}" r="4" fill="none" stroke="${c}" stroke-width="2"/><circle cx="${x+16}" cy="${y+22}" r="4" fill="none" stroke="${c}" stroke-width="2"/><line x1="${x+12}" y1="${y+10}" x2="${x+20}" y2="${y+10}" stroke="${c}" stroke-width="2"/><line x1="${x+10}" y1="${y+11}" x2="${x+14}" y2="${y+19}" stroke="${c}" stroke-width="2"/><line x1="${x+22}" y1="${y+11}" x2="${x+18}" y2="${y+19}" stroke="${c}" stroke-width="2"/>`; return `<circle cx="${x+12}" cy="${y+12}" r="7" fill="none" stroke="${c}" stroke-width="2"/><path d="M${x+12} ${y+2} v6 M${x+22} ${y+12} h-6 M${x+12} ${y+22} v-6 M${x+2} ${y+12} h6" stroke="${c}" stroke-width="2"/><circle cx="${x+24}" cy="${y+6}" r="3" fill="none" stroke="${c}" stroke-width="2"/>`; };
 const renderMap=(sel=0)=>{
  const hub={x:208,y:100,w:224,h:106};
  const hubCx=hub.x+hub.w/2, hubCy=hub.y+hub.h/2;
  let h=`<rect x="14" y="14" width="612" height="332" rx="18" fill="#fbfcff"/><rect x="${hub.x}" y="${hub.y}" width="${hub.w}" height="${hub.h}" rx="26" fill="url(#hubGrad)" stroke="#c9d9ff" stroke-width="2" filter="url(#softShadow)"/><text x="${hubCx}" y="136" text-anchor="middle" font-size="24" font-weight="900" fill="#172033">기능성 재료</text><text x="${hubCx}" y="160" text-anchor="middle" font-size="11.5" fill="#667085">기능에 따라 재료의 역할이 달라진다</text><text x="${hubCx}" y="180" text-anchor="middle" font-size="11" fill="#94a3b8">빛 · 전기 · 화학 · 생체 · 감지</text>`;
  items.forEach((it,i)=>{
   const active=i===sel;
   const tx=it.x+it.w/2, ty=it.y+it.h/2;
   let sx=hubCx, sy=hubCy;
   if(ty < hub.y){sx=clamp(tx, hub.x+28, hub.x+hub.w-28); sy=hub.y;}
   else if(ty > hub.y+hub.h){sx=clamp(tx, hub.x+28, hub.x+hub.w-28); sy=hub.y+hub.h;}
   else if(tx < hub.x){sx=hub.x; sy=clamp(ty, hub.y+22, hub.y+hub.h-22);} else {sx=hub.x+hub.w; sy=clamp(ty, hub.y+22, hub.y+hub.h-22);}   
   const dx=(tx-sx)*0.34;
   h+=`<path d="M ${sx} ${sy} C ${sx+dx} ${sy}, ${tx-dx} ${ty}, ${tx} ${ty}" fill="none" stroke="${active?it.color:'#d6deea'}" stroke-width="${active?3:2}" opacity="${active?0.92:0.85}"/>`;
   h+=`<g class="fm-node" data-i="${i}" style="cursor:pointer"><rect x="${it.x}" y="${it.y}" width="${it.w}" height="${it.h}" rx="18" fill="${active?'#f7faff':'#ffffff'}" stroke="${active?it.color:'#d8e0ea'}" stroke-width="${active?2.5:1.6}" filter="url(#softShadow)"/><circle cx="${it.x+30}" cy="${it.y+33}" r="18" fill="${it.color}" opacity="0.12" stroke="${it.color}" stroke-width="1.5"/>${iconSVG(it)}<text x="${it.x+56}" y="${it.y+29}" font-size="13.5" font-weight="900" fill="#172033">${it.name}</text><text x="${it.x+56}" y="${it.y+47}" font-size="10.5" fill="#667085">${it.short}</text></g>`;
  });
  const s=items[sel];
  h+=`<rect x="28" y="286" width="584" height="48" rx="14" fill="#ffffff" stroke="#d8e0ea"/><rect x="40" y="296" width="92" height="28" rx="14" fill="${s.color}" opacity="0.12" stroke="${s.color}"/><text x="86" y="314" text-anchor="middle" font-size="12" font-weight="900" fill="#172033">${s.name}</text><text x="146" y="304" font-size="10.5" fill="#667085">대표 예시</text><text x="146" y="319" font-size="11.5" font-weight="800" fill="#172033">${s.ex}</text><text x="360" y="304" font-size="10.5" fill="#667085">핵심 역할</text><text x="360" y="319" font-size="11.5" font-weight="800" fill="#172033">${s.role2}</text>`;
  q('#map').innerHTML=h;
  q('#mapHud').textContent='선택 분야 · '+items[sel].name;
  q('#mapSub').textContent=items[sel].role;
  [...document.querySelectorAll('.fm-node')].forEach(n=>n.addEventListener('click',()=>renderMap(+n.dataset.i)));
 };
 renderMap(0);
 rightPanel('기능성 재료는 왜 “기능”으로 분류할까?','1강은 디스플레이, 에너지, 생체, 나노전자, 나노촉매, 센서재료 등 여러 기능성 재료 분야를 소개한다.','같은 재료과학이라도 목표로 하는 기능이 빛, 전기, 화학반응, 생체적합성, 감지 등으로 달라지기 때문이다.','이 화면은 계산 시뮬레이션보다 <b>기능-응용-역할의 관계</b>를 읽는 인터랙티브 개념 지도다. 가운데의 기능성 재료에서 각 분야가 어떤 기능으로 확장되는지 구조적으로 보여준다.','','각 카드를 선택해 대표 예시와 핵심 역할이 어떻게 달라지는지 비교한다.');
 }
},

{
 title:'02 · 원자량과 mol', type:'Equation-driven', simtitle:'Si의 mol 수를 바꾸면 원자 수와 질량은 어떻게 변하는가',
 render(){
 sim.innerHTML=`<div class="hud"><span class="pill">Si · 원자번호 14</span><span class="pill" id="molHud"></span></div><svg viewBox="0 0 640 360"><circle cx="160" cy="170" r="48" fill="#e8eefc"/><text x="160" y="163" text-anchor="middle" font-size="12" font-weight="900">14 p⁺</text><text x="160" y="183" text-anchor="middle" font-size="12" font-weight="900">14 n</text><circle cx="160" cy="170" r="84" fill="none" stroke="#ccd6e5"/><circle cx="160" cy="170" r="122" fill="none" stroke="#ccd6e5"/><g id="atomE"></g><rect x="320" y="72" width="276" height="138" rx="16" fill="#fff" stroke="#d9e0ea"/><text x="346" y="103" font-size="15" font-weight="900">Silicon · mol relation</text><text x="346" y="129" font-size="11.5">Atomic mass M = 28.09 g/mol</text><text x="346" y="153" font-size="11.5">Avogadro constant Nₐ = 6.022 ×10²³ /mol</text><text x="346" y="177" font-size="11.5" id="nAtoms"></text><text x="346" y="197" font-size="11.5" id="mass"></text><rect x="334" y="232" width="250" height="62" rx="14" fill="#f8fbff" stroke="#d9e0ea"/><text x="459" y="254" text-anchor="middle" font-size="11" font-weight="900" fill="#667085" class="nohalo">핵심 관계</text><text x="350" y="276" font-size="11">mol 수가 증가하면</text><text x="350" y="292" font-size="11">원자 수와 질량이 함께 비례 증가</text></svg>`;
 ctrl.innerHTML=`<div class="slider"><label for="mol">Amount</label><input id="mol" type="range" min="0.25" max="2" step="0.25" value="1"><div class="value" id="molVal"></div></div>`;
 let e=''; for(let i=0;i<14;i++){const r=i<2?84:122,a=(i<2?i/2:(i-2)/12)*Math.PI*2;e+=`<circle cx="${160+r*Math.cos(a)}" cy="${170+r*Math.sin(a)}" r="5" fill="#3b82f6"/>`} q('#atomE').innerHTML=e;
 const update=()=>{const m=+q('#mol').value; q('#molHud').textContent=m.toFixed(2)+' mol'; q('#molVal').textContent=m.toFixed(2)+' mol'; q('#nAtoms').textContent='Atoms N = '+(m*6.022).toFixed(3)+' ×10²³'; q('#mass').textContent='Mass m = '+(m*28.09).toFixed(2)+' g';};
 q('#mol').addEventListener('input',update); update();

" font-size="9.6">매우 큼</text></svg>`;

{
 title:'05 · Thermistor · NTC / PTC / CTR', type:'S2 · Interactive Curves', simtitle:'온도 변화에 따라 저항이 어떤 방향으로 변하는가',
 render(){
 let type='NTC';
 sim.innerHTML=`<div class="hud"><span class="pill" id="thType">NTC</span><span class="pill" id="thR"></span><span class="pill" id="thState">온도계수 비교</span></div><svg viewBox="0 0 640 360"><rect x="34" y="34" width="572" height="292" rx="18" fill="#fcfdff" stroke="#d9e0ea"/><rect x="50" y="58" width="124" height="92" rx="16" fill="#ffffff" stroke="#d9e0ea"/><circle cx="92" cy="98" r="18" fill="#ffe7cd" stroke="#f59e0b" stroke-width="2"/><path d="M81 98 h22" stroke="#8a5a00" stroke-width="2"/><path d="M92 87 v22" stroke="#8a5a00" stroke-width="2"/><rect x="116" y="77" width="12" height="42" rx="6" fill="#fff4d9" stroke="#f8d48b"/><circle cx="122" cy="113" r="6" fill="#ef4444"/><rect id="thermFill" x="118" y="85" width="8" height="28" rx="4" fill="#ef4444"/><text x="112" y="140" text-anchor="middle" font-size="10.2" font-weight="800" fill="#667085" class="nohalo">thermistor</text><rect x="186" y="58" width="396" height="248" rx="14" fill="#ffffff" stroke="#d9e0ea"/><line x1="238" y1="270" x2="548" y2="270" stroke="#aeb9c8"/><line x1="238" y1="96" x2="238" y2="270" stroke="#aeb9c8"/><text x="502" y="292" font-size="10.5" font-weight="800" fill="#667085" class="nohalo">Temperature</text><text x="196" y="98" font-size="10.5" font-weight="800" fill="#667085" class="nohalo">Resistance</text><path id="curveNTC" fill="none" stroke="#bfd3ff" stroke-width="3"/><path id="curvePTC" fill="none" stroke="#ffc4c4" stroke-width="3"/><path id="curveCTR" fill="none" stroke="#cbeed8" stroke-width="3"/><path id="curveActive" fill="none" stroke="#2f6fed" stroke-width="4.5"/><line id="thGuideX" x1="238" y1="0" x2="238" y2="270" stroke="#d9e0ea" stroke-dasharray="5 5"/><line id="thGuideY" x1="238" y1="270" x2="548" y2="270" stroke="#d9e0ea" stroke-dasharray="5 5"/><circle id="thDot" r="8" fill="#ef4444"/><text id="thLbl" font-size="10.8" font-weight="900"></text><rect x="426" y="64" width="144" height="84" rx="12" fill="#f8fbff" stroke="#d9e0ea"/><text x="442" y="85" font-size="10.2" font-weight="900" fill="#667085" class="nohalo">Current mode</text><text id="modeName" x="442" y="106" font-size="15" font-weight="900"></text><text id="modeDesc" x="442" y="126" font-size="10" fill="#667085" class="nohalo"></text><rect x="426" y="151" width="144" height="24" rx="12" fill="#ffffff" stroke="#d9e0ea"/><text x="498" y="166" text-anchor="middle" font-size="10" font-weight="800" fill="#667085" class="nohalo">상대 곡선 · 개념 비교용</text><g id="thLegend"><line x1="252" y1="78" x2="270" y2="78" stroke="#2f6fed" stroke-width="3"/><text x="278" y="82" font-size="10" fill="#667085" class="nohalo">NTC</text><line x1="312" y1="78" x2="330" y2="78" stroke="#ef4444" stroke-width="3"/><text x="338" y="82" font-size="10" fill="#667085" class="nohalo">PTC</text><line x1="372" y1="78" x2="390" y2="78" stroke="#22c55e" stroke-width="3"/><text x="398" y="82" font-size="10" fill="#667085" class="nohalo">CTR</text></g></svg>`;
 ctrl.innerHTML=`<div class="row">${button('NTC','NTC','active')}${button('PTC','PTC')}${button('CTR','CTR')}</div><div class="slider"><label for="temp">Relative temperature</label><input id="temp" type="range" min="0" max="100" value="25"><div class="value" id="tempV">25 %</div></div>`;
 const curves={NTC:{color:'#2f6fed',desc:'온도 상승 → 저항 감소',state:'negative temperature coefficient'},PTC:{color:'#ef4444',desc:'온도 상승 → 저항 증가',state:'positive temperature coefficient'},CTR:{color:'#22c55e',desc:'특정 구간 이후 급격한 감소',state:'critical transition region'}};
 const f=(name,x)=>name==='NTC'?Math.exp(-2.2*x/100):name==='PTC'?(0.22+1.08*x/100):(x<58?1.0:(1.0-0.82*(x-58)/42));
 const mapX=t=>238+t/100*310, mapY=r=>270-Math.min(1.3,r)/1.3*156;
 const pathFor=name=>{let d='';for(let i=0;i<=100;i++){const x=mapX(i),y=mapY(f(name,i));d+=(i?'L':'M')+x+' '+y+' '}return d};
 q('#curveNTC').setAttribute('d',pathFor('NTC'));q('#curvePTC').setAttribute('d',pathFor('PTC'));q('#curveCTR').setAttribute('d',pathFor('CTR'));
 const draw=()=>{const t=+q('#temp').value,r=f(type,t),x=mapX(t),y=mapY(r),c=curves[type].color; q('#curveActive').setAttribute('d',pathFor(type)); q('#curveActive').setAttribute('stroke',c); q('#thDot').setAttribute('cx',x); q('#thDot').setAttribute('cy',y); q('#thDot').setAttribute('fill',c); q('#thGuideX').setAttribute('x1',x); q('#thGuideX').setAttribute('x2',x); q('#thGuideX').setAttribute('y1',y); q('#thGuideX').setAttribute('y2',270); q('#thGuideY').setAttribute('x1',238); q('#thGuideY').setAttribute('x2',x); q('#thGuideY').setAttribute('y1',y); q('#thGuideY').setAttribute('y2',y); q('#thLbl').setAttribute('x',clamp(x+10,246,516)); q('#thLbl').setAttribute('y',clamp(y-12,100,258)); q('#thLbl').textContent=r.toFixed(2); q('#thType').textContent=type; q('#thR').textContent='relative R = '+r.toFixed(2); q('#thState').textContent=curves[type].state; q('#tempV').textContent=t+' %'; q('#modeName').textContent=type; q('#modeName').setAttribute('fill',c); q('#modeDesc').textContent=curves[type].desc; q('#thermFill').setAttribute('y',85+(100-t)*0.28); q('#thermFill').setAttribute('height',28-(100-t)*0.28);};
 ['NTC','PTC','CTR'].forEach(id=>q('#'+id).onclick=()=>{type=id;['NTC','PTC','CTR'].forEach(x=>q('#'+x).classList.toggle('active',x===id));draw()});
 q('#temp').addEventListener('input',draw); draw();
 rightPanel('NTC, PTC, CTR은 무엇이 다를까?','1강은 NTC는 온도 상승 시 저항 감소, PTC는 온도 상승 시 저항 증가, CTR은 특정 온도 범위에서 저항이 급격히 감소하는 특성으로 설명한다.','세 소자는 모두 온도를 전기저항 변화로 바꾸지만, 저항 변화의 방향과 형태가 서로 다르다.','온도계수의 부호와 전이 형태가 다르기 때문에 동일한 온도 변화에도 출력 거동이 달라진다.','<div class="formula">α = (1/R)(dR/dT)</div><p class="mini">여기서는 개념 비교를 위한 정규화 곡선을 사용한다. NTC는 α&lt;0, PTC는 α&gt;0 경향을 가진다.</p>','버튼으로 소자 종류를 바꾸고, 같은 상대 온도에서 저항 변화 방향과 곡선 기울기가 어떻게 달라지는지 비교한다.');
 }
},

 const caps=['기준 상태의 금속산화물 표면이다.','산소가 표면에 흡착되어 반응 자리를 만든다.','표면 전자 포획 때문에 공핍층이 두꺼워지고 저항이 커진다.','CO가 흡착 산소를 제거하는 방향으로 반응한다.','전자 반환으로 공핍층이 얇아지고 저항이 감소한다.'];
 const state=['neutral surface','oxygen adsorption','electron capture','surface reaction','electron return'];
 const draw=()=>{q('#gsStep').textContent='STEP '+(step+1)+'/5 · '+names[step]; q('#gsGas').textContent='CO '+gas+' %'; q('#gasV').textContent=gas+' %'; q('#gsState').textContent=state[step]; q('#gsCaption').textContent=caps[step]; let oxy='', gasMol='', arrows='', ele=''; const oxyN=step>=1?(step>=3?Math.max(3,7-Math.round(gas/25)):7):0; for(let i=0;i<oxyN;i++){const x=118+i*52; oxy+=`<circle cx="${x}" cy="162" r="7" fill="#f59e0b"/>`; if(step>=2){arrows+=`<path d="M ${x} 176 V 196" stroke="#9cb6df" stroke-width="2" stroke-dasharray="4 4" fill="none"/>`;}} if(step>=3){const n=Math.max(1,Math.round(gas/25)); for(let i=0;i<n;i++){const x=124+i*92,y=86; gasMol+=`<rect x="${x}" y="${y}" width="34" height="18" rx="9" fill="#8b5cf6"/><text x="${x+17}" y="${y+12}" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">CO</text>`; arrows+=`<path d="M ${x+17} ${y+18} V 148" stroke="#8b5cf6" stroke-width="2.1" fill="none"/>`; arrows+=`<polygon points="${x+17},148 ${x+12},140 ${x+22},140" fill="#8b5cf6"/>`; }} if(step>=4){const n=Math.max(5,Math.round(5+gas/18)); for(let i=0;i<n;i++){const x=132+(i%6)*54, y=228+Math.floor(i/6)*18; ele+=`<circle cx="${x}" cy="${y}" r="4.6" fill="#3b82f6"/>`; if(i<5){arrows+=`<path d="M ${x} 192 V 218" stroke="#3b82f6" stroke-width="2.1" fill="none"/>`; arrows+=`<polygon points="${x},218 ${x-5},210 ${x+5},210" fill="#3b82f6"/>`; }}}
 q('#gsOxy').innerHTML=oxy; q('#gsGasMol').innerHTML=gasMol; q('#gsArrows').innerHTML=arrows; q('#gsElectrons').innerHTML=ele; const dh=step<2?18:(step<4?50:Math.max(18,50-gas*0.28)); q('#depl').setAttribute('y',202-dh); q('#depl').setAttribute('height',dh); const resistance=step<2?0.38:(step<4?0.88:Math.max(0.30,0.88-gas/140)); q('#rBar').setAttribute('y',218+(52*(1-resistance))); q('#rBar').setAttribute('height',52*resistance); q('#rText').textContent=step<2?'base':(step<4?'high':'lower'); q('#stepText').innerHTML='<b>'+names[step]+'</b><br>'+expl[step]; };
 q('#gsNext').onclick=()=>{step=Math.min(4,step+1);draw()}; q('#gsReset').onclick=()=>{step=0;draw()}; q('#gas').oninput=()=>{gas=+q('#gas').value;draw()}; q('#gsPlay').onclick=()=>{step=0;draw();const run=()=>{if(step>=4)return;step++;draw();timer=setTimeout(run,900)};timer=setTimeout(run,900)};
 rightPanel('반도체식 가스센서에서 전자 포획과 반환은 왜 저항 변화를 만들까?','금속산화물 표면에 산소가 흡착되면 표면 전자를 포획하여 공핍층이 두꺼워지고, CO 같은 환원성 가스가 오면 포획된 전자가 다시 반환될 수 있다.','전도도는 자유전자 수에 크게 좌우되므로, 표면에서 일어나는 전자 포획·반환은 bulk 내부의 저항 측정값으로 연결된다.','산소의 최외각전자(6개)는 전자를 더 받아 안정해지려는 경향이 있다. 표면 산소종 O₂⁻, O⁻는 반도체 전자를 잡아두고, 환원성 가스와의 반응 후 전자를 다시 돌려준다. 그 결과 n형 산화물의 공핍층과 저항이 달라진다.','<div class="formula">O<sub>2</sub>(g) + e<sup>-</sup> → O<sub>2</sub><sup>-</sup>(ads)</div><div class="formula">CO + O<sup>-</sup>(ads) → CO<sub>2</sub> + e<sup>-</sup></div><p class="mini">식은 개념도용 단순화 표현이다. 핵심은 산소가 전자를 포획하면 R↑, 전자가 반환되면 R↓라는 점이다.</p>','산소 흡착, 전자 포획, CO 반응, 전자 반환, 공핍층 두께와 저항 막대를 함께 본다.','<b>깨끗한 표면</b><br>금속산화물 표면을 기준 상태로 본다.');
 theory.querySelector('.theory-grid').insertAdjacentHTML('beforeend', `<div class="theory-wide"><div class="kicker">전자 포획 / 반환에 따른 변화 정리</div><table class="theory-table"><thead><tr><th>표면 상태</th><th>전자 수</th><th>공핍층</th><th>저항</th><th>해석</th></tr></thead><tbody><tr><td>깨끗한 표면</td><td>기준</td><td>얇음</td><td>기준</td><td>기본 상태</td></tr><tr><td>산소 흡착</td><td>감소</td><td>증가</td><td>증가</td><td>전자 포획</td></tr><tr><td>CO 반응 후</td><td>증가</td><td>감소</td><td>감소</td><td>전자 반환</td></tr></tbody></table><div class="chipline"><span class="chip">O : valence 6</span><span class="chip">Sn : valence 4</span><span class="chip">전자 포획 → R↑</span><span class="chip">전자 반환 → R↓</span></div></div>`);
 draw();
 }
},

{
 title:'08 · 원자가전자와 결합', type:'Interactive Concept', simtitle:'최외각전자의 수가 결합 성향과 어떻게 연결되는가',
 render(){
 sim.innerHTML=`<div class="hud"><span class="pill" id="veHud"></span><span class="pill" id="veShell"></span></div><svg viewBox="0 0 640 360"><circle cx="168" cy="178" r="34" fill="#eef2ff"/><circle cx="168" cy="178" r="54" fill="none" stroke="#ccd6e5"/><circle cx="168" cy="178" r="84" fill="none" stroke="#ccd6e5"/><circle cx="168" cy="178" r="114" fill="none" stroke="#ccd6e5"/><g id="veDots"></g><rect x="330" y="66" width="252" height="210" rx="16" fill="#fff" stroke="#d9e0ea"/><text id="elName" x="358" y="100" font-size="17" font-weight="900"></text><text id="elInfo" x="358" y="132" font-size="12"></text><text id="elShell" x="358" y="154" font-size="12"></text><text id="elRole" x="358" y="182" font-size="11.5"></text><text id="elBond" x="358" y="204" font-size="11.5"></text><text id="elStable" x="358" y="226" font-size="11.5"></text><rect x="352" y="238" width="208" height="22" rx="11" fill="#f8fbff" stroke="#d9e0ea"/><text x="456" y="252" text-anchor="middle" font-size="10.5" font-weight="800" fill="#667085" class="nohalo">최외각전자가 결합에 가장 쉽게 참여</text></svg>`;
 ctrl.innerHTML=`<div class="row">${button('C','C','active')}${button('Si','Si')}${button('Na','Na')}${button('Cl','Cl')}</div>`;
 const data={C:{name:'Carbon',val:4,shell:'2, 4',role:'전자 공유에 적극 참여',bond:'주로 공유결합',stable:'옥텟을 위해 4개를 공유하려는 경향'},Si:{name:'Silicon',val:4,shell:'2, 8, 4',role:'공유결합 기반 반도체 구조',bond:'사면체 공유결합',stable:'4개의 결합으로 안정한 결정 형성'},Na:{name:'Sodium',val:1,shell:'2, 8, 1',role:'전자 1개를 잃기 쉬움',bond:'이온결합에 유리',stable:'1개를 잃어 Ne형태에 가까워짐'},Cl:{name:'Chlorine',val:7,shell:'2, 8, 7',role:'전자 1개를 얻기 쉬움',bond:'이온결합 또는 극성 공유결합',stable:'1개를 얻어 옥텟을 채우려는 경향'}};
 const draw=id=>{['C','Si','Na','Cl'].forEach(x=>q('#'+x).classList.toggle('active',x===id)); const d=data[id]; q('#veHud').textContent=d.name+' · valence '+d.val; q('#veShell').textContent='shell = '+d.shell; q('#elName').textContent=d.name; q('#elInfo').textContent='Valence electrons = '+d.val; q('#elShell').textContent='Electron shell = '+d.shell; q('#elRole').textContent='결합 성향 : '+d.role; q('#elBond').textContent='대표 결합 : '+d.bond; q('#elStable').textContent='안정화 방향 : '+d.stable; let h=''; const total=d.shell.split(',').map(x=>+x.trim()); const radii=[54,84,114]; total.forEach((n,ri)=>{const r=radii[ri]||114; for(let i=0;i<n;i++){const a=i/n*Math.PI*2; h+=`<circle cx="${168+r*Math.cos(a)}" cy="${178+r*Math.sin(a)}" r="${ri===total.length-1?7:5}" fill="${ri===total.length-1?'#2f6fed':'#a5b4fc'}"/>`; }}); q('#veDots').innerHTML=h; };
 Object.keys(data).forEach(id=>q('#'+id).onclick=()=>draw(id));
 rightPanel('최외각전자는 왜 결합과 화학적 특성에 중요할까?','1강은 채워지지 않은 전자껍질의 원자가전자가 결합에 가장 쉽게 참여하고 화학적 특성을 크게 좌우한다고 설명한다.','내부 전자는 핵에 강하게 묶여 있어 잘 반응하지 않지만, 최외각 전자는 상대적으로 결합에 참여하기 쉽다.','그래서 같은 주기율표에서도 원자가전자 수가 달라지면 전자를 잃거나 얻거나 공유하려는 방향이 달라진다. 이 차이가 이온결합, 공유결합, 반도체 구조, 이온화 경향을 설명하는 출발점이 된다.','<div class="formula">valence e<sup>-</sup> → bond tendency</div><p class="mini">교육용 단순화 표현으로, 실제 결합은 전기음성도·에너지준위·결정구조와 함께 해석한다.</p>','원소 버튼을 눌러 최외각전자 수, 전자껍질 배열, 결합 경향, 안정화 방향을 함께 비교한다.');
 theory.querySelector('.theory-grid').insertAdjacentHTML('beforeend', `<div class="theory-wide"><div class="kicker">최외각전자 비교표</div><table class="theory-table"><thead><tr><th>원소</th><th>전자배치</th><th>원자가전자</th><th>주된 경향</th><th>결합 예시</th></tr></thead><tbody><tr><td>C</td><td>2,4</td><td>4</td><td>공유</td><td>C-C, C-H</td></tr><tr><td>Si</td><td>2,8,4</td><td>4</td><td>공유</td><td>Si-Si, Si-O</td></tr><tr><td>Na</td><td>2,8,1</td><td>1</td><td>잃음</td><td>Na⁺ 형성</td></tr><tr><td>Cl</td><td>2,8,7</td><td>7</td><td>얻음</td><td>Cl⁻ 형성</td></tr></tbody></table><ul class="small-list"><li>원자가전자는 화학반응에서 가장 먼저 고려하는 전자다.</li><li>옥텟에 가까워지려는 경향은 결합 방향을 이해하는 좋은 출발점이다.</li><li>반도체에서는 원자가전자 수가 도핑과 전기적 성질 해석에도 연결된다.</li></ul></div>`);
 draw('C');
 }
},

{
 title:'09 · 결합 종류와 재료 물성', type:'Interactive Synthesis', simtitle:'결합 방식이 달라지면 재료의 성질은 왜 달라지는가',
 render(){
 let type='Ionic';sim.innerHTML=`<div class="hud"><span class="pill" id="bondHud"></span></div><svg viewBox="0 0 640 360"><g id="bondViz"></g><rect x="372" y="78" width="194" height="208" rx="16" fill="#fff" stroke="#d9e0ea"/><text x="469" y="114" text-anchor="middle" font-size="12" font-weight="900">Property tendency</text><text id="bp1" x="398" y="155" font-size="11"></text><text id="bp2" x="398" y="190" font-size="11"></text><text id="bp3" x="398" y="225" font-size="11"></text></svg>`;
 ctrl.innerHTML=`<div class="row">${button('Ionic','Ionic','active')}${button('Covalent','Covalent')}${button('Metallic','Metallic')}${button('Secondary','Secondary')}</div>`;
 const draw=t=>{type=t;['Ionic','Covalent','Metallic','Secondary'].forEach(x=>q('#'+x).classList.toggle('active',x===t));let h='',p=[];if(t==='Ionic'){h=`<circle cx="135" cy="180" r="46" fill="#e7f0ff"/><text x="135" y="186" text-anchor="middle" font-size="22" font-weight="900">Na⁺</text><circle cx="285" cy="180" r="46" fill="#ffe8ef"/><text x="285" y="186" text-anchor="middle" font-size="22" font-weight="900">Cl⁻</text><line x1="181" y1="180" x2="239" y2="180" stroke="#8b5cf6" stroke-width="4"/>`;p=['정전기적 인력','세라믹에서 중요','큰 결합에너지 가능'];}else if(t==='Covalent'){h=`<circle cx="145" cy="180" r="50" fill="#edf3ff"/><circle cx="270" cy="180" r="50" fill="#edf3ff"/><line x1="185" y1="180" x2="230" y2="180" stroke="#8b5cf6" stroke-width="6"/><circle cx="200" cy="170" r="7" fill="#2f6fed"/><circle cx="218" cy="190" r="7" fill="#2f6fed"/>`;p=['전자쌍 공유','방향성 결합','세라믹·고분자 내 중요'];}else if(t==='Metallic'){for(let y=115;y<=245;y+=65)for(let x=100;x<=310;x+=70)h+=`<circle cx="${x}" cy="${y}" r="21" fill="#efe9ff"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" font-weight="900">M⁺</text>`;for(let i=0;i<12;i++)h+=`<circle cx="${90+(i*43)%240}" cy="${85+(i*37)%175}" r="4" fill="#3b82f6"/>`;p=['비국소화 전자','금속의 대표 결합','중간 수준 물성 경향'];}else{h=`<ellipse cx="145" cy="160" rx="58" ry="38" fill="#e7f0ff"/><ellipse cx="285" cy="215" rx="58" ry="38" fill="#ffe8ef"/><line x1="195" y1="177" x2="235" y2="195" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="5 5"/>`;p=['약한 분자간 상호작용','고분자 물성에 중요','낮은 Tm·E 경향'];}q('#bondViz').innerHTML=h;q('#bondHud').textContent=t+' bonding';q('#bp1').textContent='• '+p[0];q('#bp2').textContent='• '+p[1];q('#bp3').textContent='• '+p[2]};['Ionic','Covalent','Metallic','Secondary'].forEach(id=>q('#'+id).onclick=()=>draw(id));draw('Ionic');
 rightPanel('결합 방식이 달라지면 왜 재료 물성도 달라질까?','1강은 Ionic, Covalent, Metallic, Van der Waals bonding을 제시하고, 세라믹·금속·고분자에서 결합에너지와 Tm, E, 열팽창계수 α의 경향이 달라진다고 정리한다.','결합의 세기와 방향성이 다르면 원자를 떼어내거나 변형시키는 데 필요한 에너지가 달라지고, 이것이 거시적인 기계·열 물성 차이로 이어진다.','세라믹은 주로 이온·공유결합, 금속은 금속결합, 고분자는 공유결합과 secondary bonding의 조합으로 설명할 수 있다.','<p class="mini">Tm: melting temperature, E: elastic modulus, α: thermal expansion coefficient.</p>','결합 종류를 바꾸면서 전자의 역할과 대표적인 물성 경향을 함께 비교한다.');
 }
}
];
function render(){stop();const p=pages[page];pageTitle.textContent=p.title;pageCount.textContent=String(page+1).padStart(2,'0')+' / '+String(pages.length).padStart(2,'0');simTitle.textContent=p.simtitle;simType.textContent=p.type;sim.innerHTML='';ctrl.innerHTML='';theory.innerHTML='';p.render();q('#prev').disabled=page===0;q('#next').disabled=page===pages.length-1;[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===page));}
pages.forEach((p,i)=>{const d=document.createElement('button');d.className='dot';d.type='button';d.title=p.title;d.onclick=()=>{page=i;render()};dots.appendChild(d)});
q('#prev').onclick=()=>{if(page>0){page--;render()}};q('#next').onclick=()=>{if(page<pages.length-1){page++;render()}};document.querySelector('.deck').addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;if(e.key==='ArrowRight'&&page<pages.length-1){page++;render()}else if(e.key==='ArrowLeft'&&page>0){page--;render()}});
render();
})();
